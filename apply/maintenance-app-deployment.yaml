apiVersion: v1
kind: Namespace
metadata:
  name: getpatch
---
# 应用配置从 config.yaml 生成，修改后运行 python bin/sync_manifest.py。
# python bin/sync_manifest.py --check 可离线检查漂移；密码仍由 Secret 注入。
apiVersion: v1
kind: ConfigMap
metadata:
  name: maintenance-app-config
  namespace: getpatch
data:
  config.yaml: |
    redis:
      host: maintenance-redis.getpatch.svc.cluster.local
      port: 6379
      db: 0
      password: ""
      key_prefix: auto_packing
      success_ttl_seconds: 7200
      failure_ttl_seconds: 3600
      download_ttl_seconds: 90
      max_logs: 2000
      max_concurrent_tasks: 3   # worker 铺到 3 个节点后，允许 3 个构建并行

    # 升级包保留策略：每次构建成功后自动回收旧包，避免只增不删把盘吃满。
    # 三重保护：最近 min_keep 个、min_age_minutes 内的新包、本次刚构建的包，都不会被删。
    package_retention:
      enabled: true
      max_count: 40          # 最多保留多少个包
      max_total_gb: 60       # 所有包总大小上限
      min_keep: 3            # 至少保留最近 N 个
      min_age_minutes: 30    # 这么新的包不删（可能在下载或刚交付）
      dry_run: false         # true 时只记录不真删

    # 升级包存储后端
    #   local = 只落本机盘（原来的行为）
    #   oss   = 构建成功后自动上传，下载走 OSS 签名 URL；app 不再强依赖本机磁盘
    package_storage:
      backend: oss
      oss_bucket: publicshare-unsafe
      oss_prefix: tmp/auto_packing/packages/
      presign_seconds: 900          # 签名 URL 有效期（秒）
      oss_timeout_seconds: 120      # 列举/签名超时
      upload_timeout_seconds: 3600  # 上传超时（大包可能几 GB）
      # worker 用 emptyDir 跑，上传成功后删本地副本，避免单 Pod 累积几十 GB；
      # 下载会自动回落到 OSS 签名 URL
      delete_local_after_upload: true
---
apiVersion: v1
kind: Secret
metadata:
  name: maintenance-app-secrets
  namespace: getpatch
type: Opaque
stringData:
  redis-password: "YSDeepFlow@3q302"
---
# Redis Service，供 maintenance-app / maintenance-worker 通过服务名访问。
apiVersion: v1
kind: Service
metadata:
  name: maintenance-redis
  namespace: getpatch
  labels:
    app: maintenance-redis
spec:
  selector:
    app: maintenance-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
---
# Redis 本体。这个 Deployment 才是真正运行 redis-server 的地方。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-redis
  namespace: getpatch
  labels:
    app: maintenance-redis
spec:
  replicas: 1
  # 单实例 + local RWO 卷：滚动更新会让两个 redis 同时写同一份 AOF，
  # 必须用 Recreate，先停旧再起新。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: maintenance-redis
  template:
    metadata:
      labels:
        app: maintenance-redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - exec redis-server --bind 0.0.0.0 --appendonly yes --appendfsync everysec --requirepass "$REDIS_PASSWORD"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: maintenance-app-secrets
              key: redis-password
        ports:
        - containerPort: 6379
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      # Redis 数据同样落在 apk01 的 local PV 上，必须钉住节点
      nodeSelector:
        kubernetes.io/hostname: deepflowapk01
      restartPolicy: Always
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: auto-packing-redis-pvc
---
# Web/API 服务：
# - 主容器镜像是 maintenance-app:v2.0.0
# - initContainer 用 redis:7.2-alpine 只是为了复用 redis-cli，
#   在启动前检测 Redis 是否可连通且认证成功
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-app
  namespace: getpatch
  labels:
    app: maintenance-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maintenance-app
  template:
    metadata:
      labels:
        app: maintenance-app
    spec:
      initContainers:
      # 这里只是“等待 Redis 就绪”的探测容器，不是业务容器。
      - name: wait-for-redis
        image: redis:7.2-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: maintenance-app-secrets
              key: redis-password
        command:
        - /bin/sh
        - -c
        - until redis-cli -h maintenance-redis -p 6379 -a "$REDIS_PASSWORD" ping | grep PONG; do echo "waiting for redis auth ready"; sleep 2; done
      # 升级包与 Redis 都是 local 存储型 PVC，绑定在 deepflowapk01；
      # 不钉节点的话 Pod 会漂到 apk02/03，拉不到镜像、挂不上盘。
      nodeSelector:
        kubernetes.io/hostname: deepflowapk01
      # 解析GitLab
      hostAliases:
      - ip: "10.1.0.14"
        hostnames:
        - "gitlab.yunshan.net"
      # 发布时推荐使用 bin/redeploy.sh：它会用唯一 tag 更新镜像，
      # 避免 :latest + IfNotPresent 复用节点旧缓存。
      containers:
      # 真正的 maintenance-app 业务容器。
      - name: maintenance-app
        image: auto_packing:20261028-ec76d04
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: PATH
          value: "/app/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        - name: CONTAINERD_NAMESPACE
          value: "k8s.io"
        # app 只读 OSS 版本列表和本地产物，不需要 nuwa 仓库
        - name: SKIP_NUWA
          value: "1"
        - name: FLASK_APP
          value: "app.py"
        - name: FLASK_ENV
          value: "production"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: GUNICORN_WORKERS
          value: "2"
        - name: GUNICORN_THREADS
          value: "4"
        - name: APP_CONFIG_PATH
          value: "/app/config/config.yaml"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: maintenance-app-secrets
              key: redis-password
        # OSS凭据
        - name: OSS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: oss-credentials
              key: access-key-id
        - name: OSS_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: oss-credentials
              key: access-key-secret
        - name: OSS_ENDPOINT
          value: "oss-cn-beijing.aliyuncs.com"
        - name: OSS_REGION
          value: "cn-beijing"
        volumeMounts:
        - name: gitlab-ssh-key
          mountPath: /root/.ssh
          readOnly: true
        - name: containerd-sock
          mountPath: /run/containerd/containerd.sock
        - mountPath: /app/upgrade_packages
          name: storage
        - name: app-config
          mountPath: /app/config
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1024Mi"
            cpu: "1000m"
      restartPolicy: Always
      volumes:
      - name: gitlab-ssh-key
        secret:
          secretName: gitlab-ssh-key
          defaultMode: 0400
      - name: containerd-sock
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket
      - name: storage
        persistentVolumeClaim:
          claimName: auto-pancking-pvc
      - name: app-config
        configMap:
          name: maintenance-app-config
---
# 后台构建 worker：
# - 与 maintenance-app 复用同一业务镜像
# - 通过 args 覆盖启动命令，改为执行 python worker.py
# - 同样使用 initContainer 等待 Redis 就绪
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-worker
  namespace: getpatch
  labels:
    app: maintenance-worker
spec:
  # 执行所有权协议升级时不允许新旧 worker 混跑。
  strategy:
    type: Recreate
  replicas: 3
  selector:
    matchLabels:
      app: maintenance-worker
  template:
    metadata:
      labels:
        app: maintenance-worker
    spec:
      initContainers:
      # 这里只是“等待 Redis 就绪”的探测容器，不是 worker 本体。
      - name: wait-for-redis
        image: redis:7.2-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: maintenance-app-secrets
              key: redis-password
        command:
        - /bin/sh
        - -c
        - until redis-cli -h maintenance-redis -p 6379 -a "$REDIS_PASSWORD" ping | grep PONG; do echo "waiting for redis auth ready"; sleep 2; done
      # worker 只用独立临时目录和 OSS，允许调度到任意有可拉取业务镜像的节点。
      hostAliases:
      - ip: "10.1.0.14"
        hostnames:
        - "gitlab.yunshan.net"
      # 发布时推荐使用 bin/redeploy.sh（与 app 使用同一镜像）。
      containers:
      # 真正的 worker 业务容器。
      - name: maintenance-worker
        image: auto_packing:20261028-ec76d04
        imagePullPolicy: IfNotPresent
        args:
        - python
        - worker.py
        env:
        - name: PATH
          value: "/app/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        - name: CONTAINERD_NAMESPACE
          value: "k8s.io"
        # 用 skopeo 直接导出 docker-archive，不再依赖节点 containerd
        - name: COPY_TOOL
          value: "skopeo"
        # emptyDir 产物不能由 app 读取，启动时禁止错误回退到 local 存储。
        - name: REQUIRE_OSS_STORAGE
          value: "1"
        # nuwa 落到节点本地缓存目录：Pod 重建不再重复克隆（全量 446MB）
        - name: NUWA_DIR
          value: "/var/local-storage/nuwa/cache"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: APP_CONFIG_PATH
          value: "/app/config/config.yaml"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: maintenance-app-secrets
              key: redis-password
        - name: OSS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: oss-credentials
              key: access-key-id
        - name: OSS_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: oss-credentials
              key: access-key-secret
        - name: OSS_ENDPOINT
          value: "oss-cn-beijing.aliyuncs.com"
        - name: OSS_REGION
          value: "cn-beijing"
        volumeMounts:
        - name: gitlab-ssh-key
          mountPath: /root/.ssh
          readOnly: true
        # worker 不再共享 PVC：产物上传 OSS 后本地即删，各节点独立
        - mountPath: /app/upgrade_packages
          name: scratch
        - name: app-config
          mountPath: /app/config
          readOnly: true
        - name: nuwa-cache
          mountPath: /var/local-storage/nuwa
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      # 三副本铺到三个节点：尽量一个节点一个 worker
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: maintenance-worker
      restartPolicy: Always
      volumes:
      - name: gitlab-ssh-key
        secret:
          secretName: gitlab-ssh-key
          defaultMode: 0400
      - name: scratch
        emptyDir:
          sizeLimit: 20Gi
      - name: nuwa-cache
        hostPath:
          path: /var/local-storage/nuwa
          type: DirectoryOrCreate
      - name: app-config
        configMap:
          name: maintenance-app-config
---
# 对外暴露 maintenance-app 的 Web 入口。
apiVersion: v1
kind: Service
metadata:
  name: maintenance-svc
  namespace: getpatch
spec:
  selector:
    app: maintenance-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30090
  type: NodePort
