<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepFlow 升级包构建</title>
    <link rel="stylesheet" href="static/bootstrap.min.css">
    <link rel="stylesheet" href="static/all.min.css">
    <link rel="icon" href="static/favicon.ico" type="image/x-icon">
    <style>
        /* ============================================================
           TOKENS — V6 (NVIDIA Green)
           ============================================================ */
        :root {
            --canvas: #000000;
            --surface: #1a1a1a;
            --surface-hover: #242424;
            --line: #5e5e5e;
            --line-subtle: rgba(255,255,255,0.08);
            --text: #ffffff;
            --text-secondary: rgba(255,255,255,0.7);
            --text-muted: rgba(255,255,255,0.42);
            --brand: #76b900;
            --brand-hover: #5a8d00;
            --on-brand: #000000;
            --danger: #e52020;
            --success: #3f8500;
            --radius-sm: 2px;
            --radius-md: 4px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --spacing-xl: 24px;
            --font-xs: 11px;
            --font-sm: 12px;
            --font-base: 14px;
            --font-lg: 16px;
            --font-xl: 20px;
            --transition: 0.15s ease;
        }
        body[data-mode="v7"] {
            --canvas: #0b0e11;
            --surface: #1e2329;
            --surface-hover: #2b3139;
            --line: #2b3139;
            --line-subtle: rgba(255,255,255,0.06);
            --text: #eaecef;
            --text-secondary: #929aa5;
            --text-muted: #707a8a;
            --brand: #fcd535;
            --brand-hover: #f0b90b;
            --on-brand: #181a20;
            --danger: #f6465d;
            --success: #0ecb81;
            --radius-sm: 4px;
            --radius-md: 6px;
        }

        /* ============================================================
           RESET
           ============================================================ */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{
            background:var(--canvas);color:var(--text);
            font-family:"Inter","PingFang SC","Microsoft YaHei",sans-serif;
            font-size:var(--font-base);line-height:1.5;
            -webkit-font-smoothing:antialiased;overflow:hidden;height:100vh;
        }
        ::selection{background:var(--brand);color:var(--on-brand)}

        /* ============================================================
           SHELL
           ============================================================ */
        .app-shell{display:flex;flex-direction:column;height:100vh}

        /* ============================================================
           HEADER
           ============================================================ */
        .app-header{
            display:flex;align-items:center;justify-content:space-between;
            height:44px;padding:0 var(--spacing-xl);
            border-bottom:1px solid var(--line-subtle);
            background:var(--canvas);flex-shrink:0;user-select:none;
        }
        .header-title{font-size:var(--font-lg);font-weight:700;color:var(--text);letter-spacing:-0.01em}
        .header-title span{color:var(--brand)}
        .mode-toggle{
            display:flex;align-items:center;border:1px solid var(--line);
            border-radius:999px;overflow:hidden;cursor:pointer;
            font-size:var(--font-sm);font-weight:600;line-height:1;flex-shrink:0;
        }
        .mode-toggle span{padding:5px 14px;transition:all var(--transition);color:var(--text-secondary)}
        .mode-toggle span.active{background:var(--brand);color:var(--on-brand)}

        /* ============================================================
           MAIN
           ============================================================ */
        .app-main{display:flex;flex:1;min-height:0;gap:1px;background:var(--line-subtle)}
        .workspace{
            flex:1;min-width:0;background:var(--canvas);
            padding:var(--spacing-xl);display:flex;flex-direction:column;gap:var(--spacing-lg);
        }
        .packages{
            width:300px;flex-shrink:0;background:var(--canvas);
            display:flex;flex-direction:column;padding:var(--spacing-lg);gap:var(--spacing-sm);overflow:hidden;
        }

        /* ============================================================
           WORKSPACE PANELS (V6/V7)
           ============================================================ */
        .workspace-panel{display:none;flex-direction:column;gap:var(--spacing-lg);flex:1}
        .workspace-panel.active{display:flex}
        .workspace-title{font-size:var(--font-xl);font-weight:700;color:var(--text)}
        .workspace-desc{font-size:var(--font-base);color:var(--text-secondary);margin-top:var(--spacing-xs)}

        /* ============================================================
           FORM CARD — fixed height, same for V6/V7
           ============================================================ */
        .form-card{
            background:var(--surface);border:1px solid var(--line-subtle);
            border-radius:var(--radius-md);padding:var(--spacing-xl);
            display:flex;flex-direction:column;gap:var(--spacing-lg);
            flex-shrink:0;height:280px;
        }
        .form-card .form-body{flex:1;display:flex;flex-direction:column;gap:var(--spacing-lg);min-height:0}
        .form-card .btn-build{margin-top:auto;align-self:flex-start}
        .form-row{display:flex;flex-direction:column;gap:var(--spacing-xs)}
        .form-label{
            font-size:var(--font-sm);font-weight:600;color:var(--text-secondary);
            text-transform:uppercase;letter-spacing:0.04em;
        }
        .form-select,.form-control{
            background:var(--canvas);color:var(--text);border:1px solid var(--line);
            border-radius:var(--radius-sm);padding:10px 14px;font-size:var(--font-base);
            font-family:inherit;width:100%;outline:none;
            transition:border-color var(--transition);min-height:42px;
        }
        .form-select:focus,.form-control:focus{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
        .form-select option{background:var(--surface);color:var(--text)}
        .form-select:disabled,.form-control:disabled{opacity:0.4;cursor:not-allowed}

        /* Searchable version picker */
        .combo{position:relative}
        .combo-input{padding-right:36px}
        .combo-toggle{
            position:absolute;right:12px;top:50%;transform:translateY(-50%);
            color:var(--text-muted);font-size:12px;pointer-events:none;
        }
        .combo.disabled{opacity:0.4}
        .combo-list{
            position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);
            max-height:240px;overflow-y:auto;background:var(--surface);
            border:1px solid var(--line);border-radius:var(--radius-sm);
            box-shadow:0 8px 24px rgba(0,0,0,0.35);padding:4px;
        }
        .combo-option{
            padding:8px 10px;border-radius:var(--radius-sm);font-size:var(--font-sm);
            color:var(--text-secondary);cursor:pointer;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        }
        .combo-option:hover,.combo-option.active{background:var(--surface-hover);color:var(--text)}
        .combo-option.selected{color:var(--brand);font-weight:600}
        .combo-empty{padding:8px 10px;font-size:var(--font-sm);color:var(--text-muted)}
        .combo-list::-webkit-scrollbar{width:4px}
        .combo-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
        textarea.form-control{
            resize:none;height:140px;overflow-y:auto;flex-shrink:0;
            font-family:"SF Mono","Consolas","Monaco",monospace;font-size:13px;line-height:1.6;
        }
        .btn-build{
            display:inline-flex;align-items:center;justify-content:center;gap:8px;
            align-self:flex-start;padding:10px 28px;font-size:var(--font-base);font-weight:600;
            font-family:inherit;color:var(--on-brand);background:var(--brand);border:none;
            border-radius:var(--radius-sm);cursor:pointer;transition:background var(--transition);white-space:nowrap;
        }
        .btn-build:hover{background:var(--brand-hover)}
        .btn-build:disabled{opacity:0.35;cursor:not-allowed;background:var(--surface);color:var(--text-muted);border:1px solid var(--line)}

        /* ============================================================
           BUILD CARD — fixed height, idle/building states
           ============================================================ */
        .build-card{
            background:var(--surface);border:1px solid var(--line-subtle);
            border-radius:var(--radius-md);padding:var(--spacing-xl);
            display:flex;flex-direction:column;gap:var(--spacing-md);
            flex:1;min-height:0;flex-shrink:0;
        }
        .build-idle{
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            flex:1;color:var(--text-muted);font-size:var(--font-sm);gap:var(--spacing-sm);
        }
        .build-idle i{font-size:24px;opacity:0.3}
        .build-running{display:none;flex-direction:column;flex:1;gap:var(--spacing-md);min-height:0}
        .build-card.active .build-idle{display:none}
        .build-card.active .build-running{display:flex}

        /* Progress bar */
        .progress-wrap{height:4px;background:var(--canvas);border-radius:2px;overflow:hidden;flex-shrink:0}
        .progress-fill{height:100%;background:var(--brand);border-radius:2px;transition:width 0.3s ease}
        .progress-fill.error{background:var(--danger)}
        .progress-fill.success{background:var(--success)}

        .build-status-row{
            display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-md);
            font-size:var(--font-sm);color:var(--text-secondary);flex-shrink:0;
        }
        .build-status-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .build-actions{display:flex;gap:var(--spacing-sm);flex-shrink:0}
        .btn-sm{
            padding:5px 14px;font-size:12px;font-weight:600;font-family:inherit;
            border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--line);
            background:transparent;color:var(--text-secondary);white-space:nowrap;
            transition:background var(--transition),border-color var(--transition);
        }
        .btn-sm:hover{background:var(--surface-hover);border-color:var(--text-muted)}

        /* Log area */
        .build-log{
            display:none;flex:1;min-height:0;
            background:var(--canvas);border:1px solid var(--line-subtle);
            border-radius:var(--radius-sm);padding:var(--spacing-sm) var(--spacing-md);
            font-family:"SF Mono","Consolas","Monaco",monospace;font-size:12px;line-height:1.7;
            color:var(--text-secondary);overflow-y:auto;
        }
        .build-log.expanded{display:block}
        .build-log::-webkit-scrollbar{width:4px}
        .build-log::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
        .log-entry{padding:1px 0}
        .log-time{color:var(--text-muted)}
        .log-info{color:var(--text-secondary)}
        .log-success{color:var(--success)}
        .log-error{color:var(--danger)}

        .spinner{
            display:inline-block;width:16px;height:16px;border:2px solid var(--line);
            border-top-color:var(--brand);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;
        }
        @keyframes spin{to{transform:rotate(360deg)}}

        /* ============================================================
           PACKAGES
           ============================================================ */
        .packages-title{font-size:var(--font-lg);font-weight:700;color:var(--text);flex-shrink:0}
        .packages-count{font-size:var(--font-sm);color:var(--text-muted)}
        .packages-search{
            background:var(--surface);color:var(--text);border:1px solid var(--line);
            border-radius:var(--radius-sm);padding:8px 12px;font-size:var(--font-sm);
            font-family:inherit;outline:none;width:100%;flex-shrink:0;
            transition:border-color var(--transition);
        }
        .packages-search:focus{border-color:var(--brand)}
        .packages-search::placeholder{color:var(--text-muted)}
        .packages-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
        .packages-list::-webkit-scrollbar{width:4px}
        .packages-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
        .pkg-item{
            display:flex;align-items:center;justify-content:space-between;
            padding:8px 10px;border-radius:var(--radius-sm);gap:8px;
            transition:background var(--transition);
        }
        .pkg-item:hover{background:var(--surface)}
        .pkg-info{min-width:0;display:flex;flex-direction:column;gap:2px}
        .pkg-name{font-size:var(--font-sm);font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .pkg-new{
            display:inline-block;font-size:9px;font-weight:700;color:var(--on-brand);
            background:var(--brand);padding:1px 5px;border-radius:2px;margin-left:6px;
            text-transform:uppercase;letter-spacing:0.04em;vertical-align:middle;
        }
        .pkg-meta{font-size:var(--font-xs);color:var(--text-muted)}
        .pkg-download{
            flex-shrink:0;font-size:var(--font-sm);font-weight:600;color:var(--brand);
            text-decoration:none;padding:4px 8px;border-radius:var(--radius-sm);
            transition:background var(--transition);cursor:pointer;white-space:nowrap;
        }
        .pkg-download:hover{background:var(--surface-hover)}
        .pkg-empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--text-muted);font-size:var(--font-sm)}

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media(max-width:768px){
            .app-main{flex-direction:column}
            .packages{width:100%;flex:none;max-height:200px}
            .workspace{padding:var(--spacing-md)}
        }
        @media(prefers-reduced-motion:reduce){
            *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
        }
    </style>
</head>
<body data-mode="v6">
<div class="app-shell">

    <!-- HEADER -->
    <header class="app-header">
        <div class="header-title"><span>DeepFlow</span> 升级包构建</div>
        <div class="mode-toggle" id="modeToggle" role="switch" aria-checked="false" aria-label="切换 V6 / V7 模式">
            <span class="active" data-mode="v6">V6 Patch</span>
            <span data-mode="v7">V7 Image</span>
        </div>
    </header>

    <!-- MAIN -->
    <div class="app-main">
        <main class="workspace">

            <!-- V6 Panel -->
            <div id="v6Workspace" class="workspace-panel active">
                <div>
                    <div class="workspace-title">Patch 升级</div>
                    <div class="workspace-desc">选择当前版本与目标版本，自动计算差异镜像并打包。</div>
                </div>
                <form id="buildForm" class="form-card">
                    <div class="form-body">
                        <div class="form-row">
                            <label class="form-label" for="currentVersionInput">当前 Patch 版本</label>
                            <div class="combo" id="currentVersionCombo">
                                <input class="form-control combo-input" id="currentVersionInput" type="text"
                                    role="combobox" aria-expanded="false" aria-controls="currentVersionList"
                                    aria-autocomplete="list" autocomplete="off" placeholder="加载中...">
                                <i class="fas fa-chevron-down combo-toggle" aria-hidden="true"></i>
                                <div class="combo-list" id="currentVersionList" role="listbox" hidden></div>
                            </div>
                        </div>
                        <div class="form-row">
                            <label class="form-label" for="targetVersionInput">目标 Patch 版本</label>
                            <div class="combo disabled" id="targetVersionCombo">
                                <input class="form-control combo-input" id="targetVersionInput" type="text"
                                    role="combobox" aria-expanded="false" aria-controls="targetVersionList"
                                    aria-autocomplete="list" autocomplete="off" placeholder="请先选择当前版本" disabled>
                                <i class="fas fa-chevron-down combo-toggle" aria-hidden="true"></i>
                                <div class="combo-list" id="targetVersionList" role="listbox" hidden></div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn-build" id="v6BuildBtn" disabled>
                        <i class="fas fa-play"></i> 开始构建
                    </button>
                </form>
            </div>

            <!-- V7 Panel -->
            <div id="v7Workspace" class="workspace-panel">
                <div>
                    <div class="workspace-title">镜像清单</div>
                    <div class="workspace-desc">手动输入镜像名称与标签，每行一条或逗号分隔。</div>
                </div>
                <div class="form-card">
                    <div class="form-body">
                        <div class="form-row">
                            <label class="form-label" for="v7ImageList">镜像列表</label>
                            <textarea class="form-control" id="v7ImageList" aria-required="true"
                                placeholder="deepflow-server:v6.6.5550&#10;deepflow-agent:v6.6.5617&#10;pcap:v6.6.220"></textarea>
                        </div>
                    </div>
                    <button type="button" class="btn-build" id="v7BuildBtn" disabled>
                        <i class="fas fa-play"></i> 开始构建
                    </button>
                </div>
            </div>

            <!-- BUILD CARD (shared) -->
            <div class="build-card" id="buildCard">
                <div class="build-idle">
                    <i class="fas fa-chart-line"></i>
                    <span>暂无构建任务</span>
                </div>
                <div class="build-running">
                    <div class="progress-wrap">
                        <div class="progress-fill" id="progressBar" style="width:0%;"></div>
                    </div>
                    <div class="build-status-row">
                        <span class="build-status-text">
                            <span id="taskStateText">等待中</span>
                            &nbsp;·&nbsp;
                            <span id="taskMessageText"></span>
                        </span>
                        <div class="build-actions">
                            <button class="btn-sm" id="btnToggleLog">展开日志</button>
                        </div>
                    </div>
                    <div class="build-log" id="buildLog"></div>
                </div>
            </div>
        </main>

        <!-- PACKAGES -->
        <aside class="packages">
            <div class="packages-title">已有升级包 <span class="packages-count" id="filesSummary">加载中...</span></div>
            <input type="text" class="packages-search" id="fileSearchInput" placeholder="搜索..." aria-label="搜索已有升级包">
            <div class="packages-list" id="existingFilesContainer">
                <div class="pkg-empty" id="filesLoading"><span class="spinner"></span>&nbsp;加载中...</div>
                <div class="pkg-empty" id="noFilesMessage" style="display:none;">暂无已生成的升级包</div>
                <div id="filesList"></div>
            </div>
        </aside>
    </div>
</div>

<script src="static/bootstrap.bundle.min.js"></script>
<script>
/* ================================================================
   STATE
   ================================================================ */
let versionData=[],eventSource=null,currentSeries='v6',isBuilding=false;
let existingFilesData=[],logExpanded=false,lastLogSeq=0;

/* ================================================================
   UTILS
   ================================================================ */
function beforeUnloadHandler(e){e.preventDefault();e.returnValue='构建任务正在进行中，离开页面将丢失进度。';return e.returnValue}
function debounce(fn,d){let t=null;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),d)}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ================================================================
   INIT
   ================================================================ */
document.addEventListener('DOMContentLoaded',()=>{initVersionPickers();initEventListeners();setMode(currentSeries);fetchVersions(currentSeries);fetchExistingFiles()});

/* ================================================================
   MODE
   ================================================================ */
function setMode(m){
    currentSeries=m;document.body.dataset.mode=m;
    document.getElementById('v6Workspace').classList.toggle('active',m==='v6');
    document.getElementById('v7Workspace').classList.toggle('active',m==='v7');
    document.querySelectorAll('.mode-toggle span').forEach(s=>s.classList.toggle('active',s.dataset.mode===m));
    document.querySelector('.mode-toggle').setAttribute('aria-checked',m==='v7');
    if(!isBuilding)checkBuildBtnStatus();
}
function handleModeToggle(e){
    const s=e.target.closest('span[data-mode]');if(!s||s.dataset.mode===currentSeries)return;
    const m=s.dataset.mode;setMode(m);if(m==='v6'&&versionData.length===0)fetchVersions('v6');
}

/* ================================================================
   VERSIONS
   ================================================================ */
let currentPicker=null,targetPicker=null;

function initVersionPickers(){
    currentPicker=createVersionPicker({
        inputId:'currentVersionInput',listId:'currentVersionList',comboId:'currentVersionCombo',
        placeholder:'请选择当前版本',onChange:handleCurrentVersionChange
    });
    targetPicker=createVersionPicker({
        inputId:'targetVersionInput',listId:'targetVersionList',comboId:'targetVersionCombo',
        placeholder:'请选择目标版本',onChange:checkBuildBtnStatus
    });
    targetPicker.setDisabled(true);
}

function createVersionPicker(cfg){
    const input=document.getElementById(cfg.inputId);
    const list=document.getElementById(cfg.listId);
    const combo=document.getElementById(cfg.comboId);
    let options=[],selected=null,visible=[],activeIndex=-1,disabled=false;

    function setExpanded(v){list.hidden=!v;input.setAttribute('aria-expanded',v?'true':'false');if(!v)activeIndex=-1}
    function close(){setExpanded(false)}
    function choose(o){selected=o;input.value=o?o.display:'';close();if(cfg.onChange)cfg.onChange(o||null)}
    function updateActive(){
        const children=Array.from(list.children);
        children.forEach((el,i)=>el.classList.toggle('active',i===activeIndex));
        const el=children[activeIndex];
        if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'});
    }
    function render(){
        if(disabled){close();return}
        const q=input.value.trim().toLowerCase();
        const filtering=!(selected&&input.value===selected.display);
        visible=(filtering&&q)?options.filter(o=>o.display.toLowerCase().includes(q)||o.value.toLowerCase().includes(q)):options.slice();
        list.innerHTML='';
        if(visible.length===0){
            const e=document.createElement('div');e.className='combo-empty';
            e.textContent=options.length?'无匹配版本':'暂无可选版本';list.appendChild(e);
        }else{
            visible.forEach(o=>{
                const el=document.createElement('div');
                el.className='combo-option'+((selected&&o.value===selected.value)?' selected':'');
                el.setAttribute('role','option');
                el.setAttribute('aria-selected',(selected&&o.value===selected.value)?'true':'false');
                el.textContent=o.display;
                // mousedown + preventDefault：选择时 input 不触发 blur
                el.addEventListener('mousedown',ev=>{ev.preventDefault();choose(o)});
                list.appendChild(el);
            });
        }
        activeIndex=-1;setExpanded(true);
    }

    input.addEventListener('focus',()=>{if(!disabled)render()});
    input.addEventListener('click',()=>{if(!disabled&&list.hidden)render()});
    input.addEventListener('input',()=>{
        if(disabled)return;
        selected=null;
        if(cfg.onChange)cfg.onChange(null);
        render();
    });
    input.addEventListener('keydown',ev=>{
        if(disabled)return;
        if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){
            ev.preventDefault();
            if(list.hidden)render();
            if(visible.length===0)return;
            const delta=ev.key==='ArrowDown'?1:-1;
            activeIndex=(activeIndex+delta+visible.length)%visible.length;
            updateActive();
        }else if(ev.key==='Enter'){
            if(!list.hidden&&visible[activeIndex]){ev.preventDefault();choose(visible[activeIndex])}
        }else if(ev.key==='Escape'){
            close();
        }
    });
    input.addEventListener('blur',()=>{
        setTimeout(()=>{
            if(combo.contains(document.activeElement))return;
            if(selected){input.value=selected.display}
            else if(input.value.trim()){input.value='';if(cfg.onChange)cfg.onChange(null)}
            close();
        },0);
    });
    document.addEventListener('click',ev=>{if(!combo.contains(ev.target))close()});

    return {
        getValue(){return selected?selected.value:''},
        setOptions(opts,placeholder){
            options=Array.isArray(opts)?opts:[];
            selected=null;input.value='';
            if(placeholder)input.placeholder=placeholder;
            close();
        },
        setDisabled(v){
            disabled=!!v;input.disabled=disabled;combo.classList.toggle('disabled',disabled);
            if(disabled){selected=null;input.value='';close()}
        }
    };
}

async function fetchVersions(series){
    if(series!=='v6'){if(versionData.length>0)return;renderVersionOptions(true);return}
    if(currentPicker)currentPicker.setOptions([], '加载中...');
    try{
        const r=await fetch(`/versions?series=${encodeURIComponent(series)}`);
        if(currentSeries!==series)return;
        const d=await r.json();
        if(d.success&&d.versions){versionData=d.versions;renderVersionOptions()}
        else{versionData=[];renderVersionOptions(true)}
    }catch(e){if(currentSeries!==series)return;versionData=[];renderVersionOptions(true)}
}
function renderVersionOptions(isError){
    if(!currentPicker)return;
    currentPicker.setOptions(isError?[]:versionData,isError?'版本加载失败':'请选择当前版本');
    handleCurrentVersionChange(null);
}
function handleCurrentVersionChange(option){
    if(!option){
        targetPicker.setOptions([], '请先选择当前版本');
        targetPicker.setDisabled(true);
    }else{
        const currentSeq=Number(option.seq_num);
        const newer=versionData.filter(v=>Number(v.seq_num)>currentSeq);
        targetPicker.setOptions(newer,newer.length?'请选择目标版本':'暂无更新版本');
        targetPicker.setDisabled(newer.length===0);
    }
    checkBuildBtnStatus();
}

/* ================================================================
   BUILD BUTTON
   ================================================================ */
function checkBuildBtnStatus(){
    const b6=document.getElementById('v6BuildBtn'),b7=document.getElementById('v7BuildBtn');
    if(isBuilding){b6.disabled=true;b7.disabled=true;return}
    if(currentSeries==='v7'){b6.disabled=true;b7.disabled=document.getElementById('v7ImageList').value.trim().length===0}
    else{
        b7.disabled=true;
        const cv=currentPicker?currentPicker.getValue():'';
        const tv=targetPicker?targetPicker.getValue():'';
        b6.disabled=!(cv&&tv);
    }
}

/* ================================================================
   BUILD PROCESS
   ================================================================ */
function startBuildProcess(e){
    if(e)e.preventDefault();if(isBuilding)return;
    const cv=currentPicker?currentPicker.getValue():'',tv=targetPicker?targetPicker.getValue():'';
    const vi=document.getElementById('v7ImageList').value;
    if(currentSeries==='v6'&&(!cv||!tv))return;
    const b6=document.getElementById('v6BuildBtn'),b7=document.getElementById('v7BuildBtn');
    const ab=currentSeries==='v7'?b7:b6;
    const bc=document.getElementById('buildCard'),bl=document.getElementById('buildLog');

    isBuilding=true;window.addEventListener('beforeunload',beforeUnloadHandler);
    ab.disabled=true;
    ab.innerHTML='<span class="spinner"></span> 构建中...';
    bc.classList.add('active');bl.classList.remove('expanded');bl.innerHTML='';
    logExpanded=false;lastLogSeq=0;
    document.getElementById('taskStateText').textContent='排队中';
    document.getElementById('taskMessageText').textContent='';
    document.getElementById('btnToggleLog').textContent='展开日志';
    updateProgressBar(0,'');checkBuildBtnStatus();
    if(eventSource){eventSource.close();eventSource=null}

    let sseUrl,sseRetries=0;const maxRetries=3;
    if(currentSeries==='v7'){
        const im=normalizeV7Images(vi);if(im.length===0){resetBuildState();return}
        fetch('/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({series:'v7',images:im})})
            .then(r=>r.json()).then(d=>{if(d.success&&d.task_id){sseUrl=`/build?task_id=${encodeURIComponent(d.task_id)}`;connectSSE()}else resetBuildState()})
            .catch(()=>resetBuildState());
        return;
    }else{sseUrl=`/build?series=v6&current=${encodeURIComponent(cv)}&target=${encodeURIComponent(tv)}`}
    function connectSSE(){
        const sep=sseUrl.includes('?')?'&':'?';
        eventSource=new EventSource(sseUrl+sep+'since='+encodeURIComponent(lastLogSeq));
        eventSource.onmessage=function(ev){sseRetries=0;try{handleBuildStatus(JSON.parse(ev.data))}catch(e){}}
        eventSource.onerror=function(){
            if(eventSource){eventSource.close();eventSource=null}
            if(sseRetries<maxRetries&&isBuilding){sseRetries++;setTimeout(connectSSE,Math.min(1e3*Math.pow(2,sseRetries),8e3))}
            else if(isBuilding)resetBuildState();
        }
    }
    connectSSE();
}
function resetBuildState(){
    const b6=document.getElementById('v6BuildBtn'),b7=document.getElementById('v7BuildBtn'),bc=document.getElementById('buildCard');
    b6.innerHTML='<i class="fas fa-play"></i> 开始构建';b7.innerHTML='<i class="fas fa-play"></i> 开始构建';
    isBuilding=false;window.removeEventListener('beforeunload',beforeUnloadHandler);
    lastLogSeq=0;if(eventSource){eventSource.close();eventSource=null}
    bc.classList.remove('active');checkBuildBtnStatus();
}
let newPackageName='';
function handleBuildStatus(d){
    const st=document.getElementById('taskStateText');
    const mt=document.getElementById('taskMessageText'),logs=Array.isArray(d.logs)?d.logs:[];
    // 服务端只推送游标之后的新日志，直接追加即可
    logs.forEach(l=>{
        if(l&&l.content)addLog(l.content,mapLogLevel(l.level));
        if(l&&Number.isInteger(l.seq)&&l.seq>lastLogSeq)lastLogSeq=l.seq;
    });
    if(Number.isInteger(d.log_seq)&&d.log_seq>lastLogSeq)lastLogSeq=d.log_seq;
    switch(d.status){
        case'queued':st.textContent='排队中';updateProgressBar(d.percent||0,'');mt.textContent=d.message||'';break;
        case'progress':st.textContent='构建中';updateProgressBar(d.percent,d.message);mt.textContent=d.message||'';break;
        case'complete':
            st.textContent='已完成';updateProgressBar(100,'success');mt.textContent='升级包已加入右侧列表';
            newPackageName=d.package_name||'';
            isBuilding=false;window.removeEventListener('beforeunload',beforeUnloadHandler);
            if(eventSource){eventSource.close();eventSource=null}
            {let b6=document.getElementById('v6BuildBtn');let b7=document.getElementById('v7BuildBtn');
            b6.innerHTML='<i class="fas fa-play"></i> 开始构建';b7.innerHTML='<i class="fas fa-play"></i> 开始构建';}
            fetchExistingFiles();checkBuildBtnStatus();
            break;
        case'error':
            st.textContent='失败';
            updateProgressBar(0,'error');
            mt.textContent=d.message||'';
            addLog(d.message,'error');
            isBuilding=false;
            window.removeEventListener('beforeunload',beforeUnloadHandler);
            if(eventSource){eventSource.close();eventSource=null}
            document.getElementById('btnToggleLog').textContent='收起日志';
            bl.classList.add('expanded');
            checkBuildBtnStatus();
            break;
    }
}

/* ================================================================
   PROGRESS & LOG
   ================================================================ */
function updateProgressBar(pct,modifier){
    const b=document.getElementById('progressBar');const p=Math.max(0,Math.min(100,pct||0));
    b.style.width=p+'%';b.classList.remove('error','success');
    if(modifier==='error')b.classList.add('error');if(modifier==='success')b.classList.add('success');
}
function addLog(msg,type){
    const c=String(msg).trim();if(!c)return;
    const el=document.getElementById('buildLog'),d=document.createElement('div');d.className='log-entry';
    const ts=new Date().toTimeString().slice(0,8);
    const cls=type==='error'?'log-error':type==='success'?'log-success':'log-info';
    const time=document.createElement('span');time.className='log-time';time.textContent=`[${ts}]`;
    const text=document.createElement('span');text.className=cls;text.textContent=c;
    d.append(time,' ',text);el.appendChild(d);el.scrollTop=el.scrollHeight;
}
function mapStatusToLogType(s){return s==='complete'?'success':s==='error'?'error':'info'}
function mapLogLevel(l){return l==='ERROR'?'error':l==='WARNING'?'info':'info'}

/* ================================================================
   PACKAGES
   ================================================================ */
async function fetchExistingFiles(){
    const fl=document.getElementById('filesLoading'),nf=document.getElementById('noFilesMessage'),fs=document.getElementById('filesList');
    fl.style.display='flex';nf.style.display='none';fs.innerHTML='';
    try{
        const r=await fetch('/existing-packages'),d=await r.json();fl.style.display='none';
        if(d.success&&d.files&&d.files.length>0){existingFilesData=d.files;renderExistingFiles(d.files);updateFilesSummary(d.files.length);newPackageName=''}
        else{existingFilesData=[];nf.style.display='flex';updateFilesSummary(0);newPackageName=''}
    }catch(e){fl.style.display='none';existingFilesData=[];nf.style.display='flex';updateFilesSummary(0)}
}
function renderExistingFiles(files){
    const fl=document.getElementById('filesList'),nf=document.getElementById('noFilesMessage');
    if(!files||files.length===0){nf.style.display='flex';fl.innerHTML='';return}
    nf.style.display='none';
    fl.innerHTML=files.map((f,i)=>{
        const m=f.name.match(/deepflow_patch_v(\d+)_(.+)_(.+)\.tar\.gz/);
        const d=m?m[2]+' → '+m[3].replace(/_/g,'-'):f.name.replace('deepflow_patch_','').replace('.tar.gz','');
        const mb=(f.size/1048576).toFixed(1);
        const badge=(i===0&&newPackageName)?'<span class="pkg-new">NEW</span>':'';
        return`<div class="pkg-item"><div class="pkg-info"><div class="pkg-name" title="${escapeHtml(f.name)}">${escapeHtml(d)}${badge}</div><div class="pkg-meta">${mb} MB</div></div><a class="pkg-download" href="/download-existing/${encodeURIComponent(f.name)}" data-filename="${escapeHtml(f.name)}" onclick="return checkExistingFileDownload(event,this)"><i class="fas fa-download"></i> 下载</a></div>`;
    }).join('');
}
function updateFilesSummary(n){document.getElementById('filesSummary').textContent=n+' 个包'}
function filterExistingFiles(){
    const q=document.getElementById('fileSearchInput').value.toLowerCase();
    renderExistingFiles(q?existingFilesData.filter(f=>f.name.toLowerCase().includes(q)):existingFilesData);
}
async function checkExistingFileDownload(e,el){try{const r=await fetch(el.href,{method:'HEAD'});if(!r.ok){e.preventDefault();fetchExistingFiles()}return true}catch(err){e.preventDefault();return false}}
function normalizeV7Images(raw){return raw.split(/[,，;\n\r]+/).map(s=>s.trim()).filter(Boolean)}

/* ================================================================
   LISTENERS
   ================================================================ */
function initEventListeners(){
    document.getElementById('modeToggle').addEventListener('click',handleModeToggle);
    document.getElementById('v7ImageList').addEventListener('input',checkBuildBtnStatus);
    document.getElementById('buildForm').addEventListener('submit',startBuildProcess);
    document.getElementById('v7BuildBtn').addEventListener('click',startBuildProcess);
    document.getElementById('fileSearchInput').addEventListener('input',debounce(filterExistingFiles,200));
    document.getElementById('btnToggleLog').addEventListener('click',function(){
        logExpanded=!logExpanded;
        document.getElementById('buildLog').classList.toggle('expanded',logExpanded);
        this.textContent=logExpanded?'收起日志':'展开日志';
    });
}
</script>
