<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepFlow 升级包构建</title>
    <link rel="icon" href="static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="static/app.css?v=20261022">
    <script src="static/app.js?v=20261022" defer></script>
</head>
<body data-mode="v6">
<div class="app-shell">

    <!-- HEADER -->
    <header class="app-header">
        <h1 class="header-title"><span>DeepFlow</span> <span class="header-subtitle">升级包构建</span></h1>
        <div class="mode-toggle" id="modeToggle" role="radiogroup" aria-label="构建模式">
            <label class="mode-option">
                <input type="radio" name="buildMode" value="v6" aria-controls="v6Workspace" checked>
                <span>V6 Patch</span>
            </label>
            <label class="mode-option">
                <input type="radio" name="buildMode" value="v7" aria-controls="v7Workspace">
                <span>V7 Image</span>
            </label>
        </div>
    </header>

    <!-- MAIN -->
    <div class="app-main">
        <main class="workspace">

            <!-- V6 Panel -->
            <div id="v6Workspace" class="workspace-panel active">
                <div>
                    <h2 class="workspace-title">Patch 升级</h2>
                    <div class="workspace-desc">选择当前版本与目标版本，自动计算差异镜像并打包。</div>
                </div>
                <form id="buildForm" class="form-card">
                    <div class="form-body">
                        <div class="version-grid">
                            <div class="form-row">
                                <label class="form-label" for="currentVersionInput">当前 Patch 版本</label>
                                <div class="combo" id="currentVersionCombo">
                                    <input class="form-control combo-input" id="currentVersionInput" type="text"
                                        role="combobox" aria-expanded="false" aria-controls="currentVersionList"
                                        aria-autocomplete="list" autocomplete="off" placeholder="加载中...">
                                    <svg class="combo-toggle" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.7 3.3 6l1.1-1.1L8 8.5l3.6-3.6L12.7 6 8 10.7Z"/></svg>
                                    <div class="combo-list" id="currentVersionList" role="listbox" tabindex="-1" hidden></div>
                                </div>
                            </div>
                            <div class="version-arrow" aria-hidden="true"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.3 2.3 14 7l-4.7 4.7-1.1-1.1L11.2 8H2V6.5h9.2L8.2 3.4l1.1-1.1Z"/></svg></div>
                            <div class="form-row">
                                <label class="form-label" for="targetVersionInput">目标 Patch 版本</label>
                                <div class="combo disabled" id="targetVersionCombo">
                                    <input class="form-control combo-input" id="targetVersionInput" type="text"
                                        role="combobox" aria-expanded="false" aria-controls="targetVersionList"
                                        aria-autocomplete="list" autocomplete="off" placeholder="请先选择当前版本" disabled>
                                    <svg class="combo-toggle" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.7 3.3 6l1.1-1.1L8 8.5l3.6-3.6L12.7 6 8 10.7Z"/></svg>
                                    <div class="combo-list" id="targetVersionList" role="listbox" tabindex="-1" hidden></div>
                                </div>
                            </div>
                        </div>
                        <div class="form-hint" id="v6Preview" aria-live="polite"></div>
                    </div>
                    <button type="submit" class="btn-build" id="v6BuildBtn" disabled>
                        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6L13 8 5 3.2Z"/></svg> 开始构建
                    </button>
                </form>
            </div>

            <!-- V7 Panel -->
            <div id="v7Workspace" class="workspace-panel">
                <div>
                    <h2 class="workspace-title">镜像清单</h2>
                    <div class="workspace-desc">手动输入镜像名称与标签，每行一条或逗号分隔。</div>
                </div>
                <div class="form-card">
                    <div class="form-body">
                        <div class="form-row">
                            <label class="form-label" for="v7ImageList">镜像列表</label>
                            <textarea class="form-control" id="v7ImageList" aria-required="true"
                                placeholder="deepflow-server:v6.6.5550&#10;deepflow-agent:v6.6.5617&#10;pcap:v6.6.220"></textarea>
                        </div>
                        <div class="form-hint" id="v7Preview" aria-live="polite"></div>
                    </div>
                    <button type="button" class="btn-build" id="v7BuildBtn" disabled>
                        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6L13 8 5 3.2Z"/></svg> 开始构建
                    </button>
                </div>
            </div>

            <!-- BUILD CARD (shared) -->
            <div class="build-card" id="buildCard">
                <div class="build-idle">
                    <div class="task-center-head">
                        <h2 class="task-center-title">任务中心</h2>
                        <button type="button" class="btn-sm" id="btnRefreshOverview">刷新</button>
                    </div>
                    <div class="task-overview">
                        <div class="task-overview-error" id="taskOverviewError" role="status" hidden>状态获取失败，稍后自动重试</div>
                        <section class="task-section">
                            <h3 class="task-section-title">进行中 <span class="task-count" id="activeTaskCount">0</span></h3>
                            <div class="task-list" id="activeTaskList"></div>
                            <div class="task-empty" id="activeTaskEmpty">暂无进行中的构建</div>
                        </section>
                        <section class="task-section">
                            <h3 class="task-section-title">最近完成</h3>
                            <div class="task-list" id="recentTaskList"></div>
                            <div class="task-empty" id="recentTaskEmpty">暂无构建记录</div>
                        </section>
                    </div>
                    <div class="system-strip" id="systemStrip">
                        <span class="system-item"><span class="status-dot" id="workerDot"></span><span id="workerText">Worker 状态未知</span></span>
                        <span class="system-item">队列 <b id="queueLength">-</b></span>
                        <span class="system-item">并发 <b id="activeSlots">-</b>/<b id="maxSlots">-</b></span>
                        <span class="system-item">磁盘剩余 <b id="diskFree">-</b></span>
                    </div>
                </div>
                <div class="build-running">
                    <div class="progress-wrap">
                        <div class="progress-fill" id="progressBar" style="width:0%;"></div>
                    </div>
                    <div class="build-status-row">
                        <span class="build-status-text" aria-live="polite">
                            <span id="taskStateText">等待中</span>
                            &nbsp;·&nbsp;
                            <span id="taskMessageText"></span>
                        </span>
                        <div class="build-actions">
                            <a class="btn-sm" id="btnDownloadPackage" style="display:none;" href="#">下载升级包</a>
                            <button class="btn-sm" id="btnBackToTasks" style="display:none;" type="button">返回任务中心</button>
                            <button class="btn-sm danger" id="btnCancelBuild" style="display:none;" disabled>取消构建</button>
                            <button class="btn-sm" id="btnToggleLog">展开日志</button>
                        </div>
                    </div>
                    <div class="build-log" id="buildLog"></div>
                </div>
            </div>
        </main>

        <!-- PACKAGES -->
        <aside class="packages">
            <h2 class="packages-title">已有升级包 <span class="packages-count" id="filesSummary">加载中...</span></h2>
            <input type="text" class="packages-search" id="fileSearchInput" placeholder="搜索..." aria-label="搜索已有升级包">
            <div class="packages-list" id="existingFilesContainer">
                <div class="pkg-empty" id="filesLoading"><span class="spinner"></span>&nbsp;加载中...</div>
                <div class="pkg-empty" id="noFilesMessage" style="display:none;">暂无已生成的升级包</div>
                <div id="filesList"></div>
            </div>
        </aside>
    </div>
</div>

<div class="toast-region" id="toastRegion" role="status" aria-live="polite"></div>

</body>
</html>
